# Monthly version updates, one grouped PR per ecosystem, with a 7-day cooldown.
# Security updates come from the repo setting, not this file.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    assignees:
      - "johnkferguson"
    commit-message:
      prefix: "ci(deps)"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
